version: '3.8'

# Full Docker setup - App + Database in containers
# Use this if you want everything in Docker

services:
  # StudyMate Application
  app:
    build: .
    container_name: studymate-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis123
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - studymate-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: studymate-db-full
    restart: unless-stopped
    environment:
      POSTGRES_DB: studymate_dev
      POSTGRES_USER: studymate
      POSTGRES_PASSWORD: studymate123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - studymate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studymate -d studymate_dev"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: studymate-cache-full
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    networks:
      - studymate-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  studymate-network:
    driver: bridge
